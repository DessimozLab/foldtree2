name: Conda Validation

on:
  push:
    branches: [main, dev]
    paths:
      - 'foldtree2/**'
      - 'conda-recipe/**'
      - 'conda-pydssp/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'scripts/*conda*'
      - '.github/workflows/*conda*'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conda-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: '3.10'
          channels: conda-forge,bioconda
          channel-priority: strict
          activate-environment: packaging
      - name: Install build tools
        shell: bash -el {0}
        run: conda install -y conda-build
      - name: Build, test and install in a fresh environment
        shell: bash -el {0}
        run: bash scripts/test_conda_packaging.sh --croot "$RUNNER_TEMP/cb" --cli-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: conda-linux-64
          path: ${{ runner.temp }}/cb/output/**/*.conda
          if-no-files-found: error
