name: Conda Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: '3.10'
          channels: conda-forge,bioconda
          channel-priority: strict
          activate-environment: packaging
      - name: Install build tools
        shell: bash -el {0}
        run: conda install -y conda-build
      - name: Check release tag matches metadata
        if: github.event_name == 'release'
        shell: bash -el {0}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomli
          with open('pyproject.toml', 'rb') as source:
              version = tomli.load(source)['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}')
          PY
      - name: Build and validate release package
        shell: bash -el {0}
        run: bash scripts/test_conda_packaging.sh --croot "$RUNNER_TEMP/cb" --cli-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: conda-release-linux-64
          path: ${{ runner.temp }}/cb/output/**/*.conda
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-22.04
    environment: conda
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: conda-release-linux-64
          path: packages
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: publishing
      - name: Install publisher
        shell: bash -el {0}
        run: conda install -y -c conda-forge 'anaconda-client>=1.12,<1.14'
      - name: Publish to configured Anaconda channel
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER }}
        run: |
          : "${ANACONDA_API_TOKEN:?Configure ANACONDA_TOKEN in the conda environment}"
          : "${ANACONDA_OWNER:?Configure ANACONDA_OWNER in the conda environment}"
          mapfile -d '' dependency < <(find packages -name 'pydssp-*.conda' -print0)
          mapfile -d '' package < <(find packages -name 'foldtree2-*.conda' -print0)
          test "${#dependency[@]}" -eq 1
          test "${#package[@]}" -eq 1
          anaconda upload --skip-existing --user "$ANACONDA_OWNER" --label main "${dependency[@]}"
          anaconda upload --user "$ANACONDA_OWNER" --label main "${package[@]}"
      - name: Attach validated package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -d '' packages < <(find packages -name '*.conda' -print0)
          test "${#packages[@]}" -eq 2
          gh release upload "$RELEASE_TAG" "${packages[@]}"
