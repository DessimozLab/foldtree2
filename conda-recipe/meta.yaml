{% set name = "foldtree2" %}
{% set version = load_file_data('../pyproject.toml', from_recipe_dir=True)['project']['version'] %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  skip: true  # [not linux64]

requirements:
  host:
    - python
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - __glibc >=2.34
    # Core scientific computing
    - numpy >=1.21.0
    - pandas >=1.3.0
    - scipy >=1.7.0
    - matplotlib-base >=3.4.0
    - networkx
    
    # PyTorch ecosystem
    - pytorch >=2.0.0
    - pytorch_geometric >=2.3.0
    
    # Bioinformatics tools
    - biopython >=1.79
    - prody >=2.0.0
    - pydssp >=0.9.1
    - gemmi >=0.6.0
    - foldcomp
    
    # Deep learning utilities
    - pytorch-lightning >=2.0.0
    - tensorboard >=2.10.0
    - einops >=0.6.0
    
    # Phylogenetics
    - ete3 >=3.1.2
    - mafft
    # The multistate RAxML-NG build and token helpers are bundled.
    
    # Utilities
    - colour >=0.1.5
    - datasketch >=1.5.0
    - pebble >=5.0.0
    - python-wget
    - requests
    - toytree
    - toyplot
    - tqdm >=4.62.0
    - h5py >=3.6.0
    - pyyaml >=5.4.0
    - optuna
    
test:
  imports:
    - foldtree2
    - foldtree2.src.models.encoder
    - foldtree2.src.models.mono_decoders
    - foldtree2.src.graphs.pdbgraph
    - foldtree2.src.graphs.pdbgraphmk2
  commands:
    - foldtree2 --about
    - pdbs-to-graphs --help
    - makesubmat --help
    - ft2treebuilder --help
    - foldcomp2fasta --help
    - tune-monodecoder-bayes --help
    - raxml-ng --version
    - mafft --version

about:
  home: https://github.com/DessimozLab/foldtree2
  license: MIT
  license_file: LICENSE.txt
  summary: 'Maximum Likelihood Phylogenetic Tree Inference from Protein Structures'
  description: |
    FoldTree2 performs phylogenetic tree inference from protein 3D structures 
    using neural network-based structural encoding. The core workflow: 
    PDB → Graph → Encoder → Discrete Alphabet → Substitution Matrix → Tree Inference.
  dev_url: https://github.com/DessimozLab/foldtree2
  doc_url: https://github.com/DessimozLab/foldtree2/blob/main/README.md

extra:
  recipe-maintainers:
    - dmoi
